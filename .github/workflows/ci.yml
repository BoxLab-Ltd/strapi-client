name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test

  # The main ruleset requires a single "verify" status check, but a matrix
  # job reports per-entry contexts ("verify (22)"), so no check ever matched
  # and every PR sat BLOCKED. This aggregate reports the one context the
  # ruleset expects, whatever the matrix looks like.
  verify:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the test matrix failed
        if: ${{ needs.test.result != 'success' }}
        run: exit 1
